name: Build iKuai Capability Probe

on:
  workflow_dispatch:
    inputs:
      probe_version:
        description: "Probe package version"
        required: true
        default: "0.2.1"
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-probe.yml"
      - "cmd/ikuai-cap-probe/**"
      - "probe/**"
      - "go.mod"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false

      - name: Resolve package version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.probe_version || '0.2.1' }}
        run: |
          set -euo pipefail
          VERSION="$INPUT_VERSION"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9._-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 2
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Probe version: $VERSION"

      - name: Build static probe
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath \
            -ldflags="-s -w -X main.version=$VERSION" \
            -o dist/ikuai-cap-probe \
            ./cmd/ikuai-cap-probe
          file dist/ikuai-cap-probe
          go version -m dist/ikuai-cap-probe

      - name: Build offline Docker image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cp dist/ikuai-cap-probe probe/ikuai-cap-probe
          docker build --platform linux/amd64 -t "ikuai-cap-probe:$VERSION" probe
          rm -f probe/ikuai-cap-probe
          mkdir -p work
          docker save "ikuai-cap-probe:$VERSION" | gzip -9 > work/docker_image.tar.gz
          gzip -t work/docker_image.tar.gz
          docker image inspect "ikuai-cap-probe:$VERSION" --format 'os={{.Os}} arch={{.Architecture}}'
          ls -lh work/docker_image.tar.gz

      - name: Package iKuai bridge probe
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          STAGE="$ROOT/stage"
          PKG="$STAGE/ikuai-cap-probe-bridge"
          OUT="$ROOT/out"
          rm -rf "$STAGE" "$OUT"
          mkdir -p "$PKG/app" "$PKG/ui/ico" "$OUT"
          cp "$ROOT/work/docker_image.tar.gz" "$PKG/docker_image.tar.gz"

          cat > "$PKG/manifest.json" <<EOF
          {
            "name": "ikuai-cap-probe-bridge",
            "version": "$VERSION",
            "display_name": "iKuai 能力探针",
            "image": "ikuai-cap-probe:$VERSION",
            "description": "Standalone iKuai 4.0 Docker capability and network probe",
            "type": "1",
            "maintainer": "Bigzhangbig",
            "maintainer_url": "https://github.com/Bigzhangbig/Ikuai4test",
            "distributor": "Bigzhangbig",
            "distributor_url": "https://github.com/Bigzhangbig/Ikuai4test",
            "requirements": {
              "memory": "64MB",
              "storage": "64MB",
              "os_min_version": "4.0.0"
            }
          }
          EOF

          cat > "$PKG/app/.env" <<'EOF'
          CPUS_LIMIT=0
          MEMORY_LIMIT=0
          HOST_IP=0.0.0.0
          RESTART=always
          APP_PORT_WEB=18080
          PROBE_REPORT_TCP=
          PROBE_TARGETS=
          PROBE_DNS_NAME=www.qq.com
          PROBE_TCP_TARGETS=223.5.5.5:53,1.1.1.1:443
          EOF

          cat > "$PKG/app/environment" <<'EOF'
          # Reserved for future advanced probe variables.
          EOF

          cat > "$PKG/app/option.json" <<'EOF'
          [
            {
              "default": 18080,
              "attrname": "APP_PORT_WEB",
              "label": {"en": "Probe Web port", "zh": "探针 Web 端口"},
              "required": true,
              "scope": "config",
              "type": "integer",
              "min": 1,
              "max": 65535,
              "description": {"zh": "保留用于验证 Docker 端口发布；主要结果请使用下方 TCP 主动回传。"}
            },
            {
              "default": "",
              "attrname": "PROBE_REPORT_TCP",
              "label": {"en": "Report receiver", "zh": "结果回传地址"},
              "required": false,
              "scope": "config",
              "type": "text",
              "min": 0,
              "max": 255,
              "description": {"zh": "推荐填写同一 LAN 中电脑的 IP:端口，例如 192.168.9.20:18082。探针会主动 TCP 连接并发送完整 JSON；连接失败会每 8 秒重试。"}
            },
            {
              "default": "",
              "attrname": "PROBE_TARGETS",
              "label": {"en": "LAN TCP targets", "zh": "LAN TCP 测试目标"},
              "required": false,
              "scope": "config",
              "type": "text",
              "min": 0,
              "max": 2048,
              "description": {"zh": "多个 host:port 用逗号分隔，例如 192.168.9.1:80,192.168.9.10:443。只做 TCP connect。"}
            },
            {
              "default": "www.qq.com",
              "attrname": "PROBE_DNS_NAME",
              "label": {"en": "DNS test name", "zh": "DNS 测试域名"},
              "required": true,
              "scope": "config",
              "type": "text",
              "min": 1,
              "max": 253
            },
            {
              "default": "223.5.5.5:53,1.1.1.1:443",
              "attrname": "PROBE_TCP_TARGETS",
              "label": {"en": "External TCP targets", "zh": "外网 TCP 测试目标"},
              "required": true,
              "scope": "config",
              "type": "text",
              "min": 1,
              "max": 2048
            }
          ]
          EOF

          cat > "$PKG/app/docker-compose.yaml" <<'EOF'
          services:
            probe:
              image: ikuai-cap-probe:__VERSION__
              container_name: ikuai-cap-probe-${NAME_NONCE}
              deploy:
                resources:
                  limits:
                    cpus: ${CPUS_LIMIT}
                    memory: ${MEMORY_LIMIT}
              restart: ${RESTART}
              cap_add:
                - NET_ADMIN
                - NET_RAW
              device_cgroup_rules:
                - 'c 10:200 rwm'
              ports:
                - ${HOST_IP}:${APP_PORT_WEB}:8080/tcp
              environment:
                PROBE_MODE: bridge
                PROBE_PORT: "8080"
                PROBE_REPORT_TCP: ${PROBE_REPORT_TCP}
                PROBE_TARGETS: ${PROBE_TARGETS}
                PROBE_DNS_NAME: ${PROBE_DNS_NAME}
                PROBE_TCP_TARGETS: ${PROBE_TCP_TARGETS}
              env_file:
                - ./environment
              logging:
                driver: json-file
                options:
                  max-size: "10m"
                  max-file: "3"
              networks:
                - doc_app_default
              labels:
                createdBy: "iKuai Capability Probe"
          networks:
            doc_app_default:
              external: true
              name: doc_app_default
          EOF
          sed -i "s/__VERSION__/$VERSION/g" "$PKG/app/docker-compose.yaml"

          cat > "$PKG/readme" <<'EOF'
          iKuai 4.0 Docker 能力探针 0.2 系列。

          已知：
          - 本地安装只接受 Docker type=1。
          - iKuai 会明确拒绝 network_mode: host，因此本版不再测试 host。
          - 部分环境下应用“打开”会给出 Docker 内部 IP，不能作为可靠的结果读取通道。

          推荐使用“主动回传”：
          1. 在同一 LAN 的 Mac/Linux 上运行：
             nc -l 18082 > ikuai-probe.json
          2. 应用配置“结果回传地址”填写：
             <Mac的LAN-IP>:18082
          3. 启动应用。探针约 3 秒后开始测试，并主动连接该地址发送完整 JSON。
             如果接收端尚未启动，会每 8 秒重试，直到发送成功。

          这同时就是一项 Docker -> LAN 的真实可达性测试。

          PROBE_TARGETS 可额外填写确定存在的局域网服务，例如：
          192.168.9.1:80,192.168.9.10:443

          测试项目包括接口、路由、默认网关、DNS、外网 TCP、LAN TCP、
          TUN、NET_ADMIN、NET_RAW、IPv4 forwarding sysctl、
          iptables/nftables、UPnP SSDP、NAT-PMP、PCP、resolver、cgroup。
          EOF

          cat > "$PKG/changelog" <<EOF
          $VERSION
          - Remove host-mode package after iKuai validation rejected network_mode:host.
          - Add outbound TCP report delivery so diagnostics do not depend on reaching the container Web UI.
          - Retry report delivery every 8 seconds until a receiver is reachable.
          - Keep Web port publishing only as a secondary Docker-port-mapping test.
          EOF

          python3 - "$PKG/ui/ico/app.png" <<'PY'
          import binascii, struct, sys, zlib
          w=h=256
          def chunk(k,d):
              return struct.pack(">I",len(d))+k+d+struct.pack(">I",binascii.crc32(k+d)&0xffffffff)
          rows=[]
          for y in range(h):
              row=bytearray([0])
              for x in range(w):
                  rgba=[34,40,49,255]
                  dx=x-128; dy=y-128
                  if dx*dx+dy*dy < 86*86:
                      rgba=[67,97,238,255]
                  if abs(dx) < 8 or abs(dy) < 8:
                      if dx*dx+dy*dy < 62*62:
                          rgba=[245,247,250,255]
                  row.extend(rgba)
              rows.append(bytes(row))
          png=b"\x89PNG\r\n\x1a\n"
          png+=chunk(b"IHDR",struct.pack(">IIBBBBB",w,h,8,6,0,0,0))
          png+=chunk(b"IDAT",zlib.compress(b"".join(rows),9))
          png+=chunk(b"IEND",b"")
          open(sys.argv[1],"wb").write(png)
          PY

          python3 -m json.tool "$PKG/manifest.json" >/dev/null
          python3 -m json.tool "$PKG/app/option.json" >/dev/null
          (cd "$PKG/app" && docker compose --env-file .env -f docker-compose.yaml config >/dev/null)

          OUTPUT="$OUT/ikuai-cap-probe-bridge-$VERSION.ipkg"
          (cd "$STAGE" && tar -czf "$OUTPUT" ikuai-cap-probe-bridge/)
          gzip -t "$OUTPUT"
          tar -tzf "$OUTPUT" >/dev/null
          (cd "$OUT" && sha256sum *.ipkg > SHA256SUMS)
          ls -lh "$OUTPUT"
          cat "$OUT/SHA256SUMS"

      - name: Inspect package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          pkg="out/ikuai-cap-probe-bridge-$VERSION.ipkg"
          tar -tzf "$pkg"
          tar -xOzf "$pkg" ikuai-cap-probe-bridge/manifest.json | python3 -m json.tool
          tar -xOzf "$pkg" ikuai-cap-probe-bridge/app/docker-compose.yaml

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ikuai-capability-probe-${{ steps.version.outputs.version }}
          path: |
            out/*.ipkg
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
