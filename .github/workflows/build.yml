name: Build iKuai Tailscale Docker IPKG

on:
  workflow_dispatch:
    inputs:
      tailscale_ref:
        description: "Tailscale Git ref/tag. Use 'latest' for latest stable."
        required: true
        default: "latest"
        type: string
  push:
    branches: [main]
    paths: [".github/workflows/build.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Resolve Tailscale ref
        id: resolve
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.tailscale_ref || 'latest' }}
        run: |
          set -euo pipefail
          if [[ "$REQUESTED_REF" == "latest" ]]; then
            TS_REF="$(curl -fsSL https://api.github.com/repos/tailscale/tailscale/releases/latest | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          else
            TS_REF="$REQUESTED_REF"
          fi
          echo "ref=$TS_REF" >> "$GITHUB_OUTPUT"
          echo "Resolved: $TS_REF"

      - name: Fetch upstream Tailscale
        env:
          TS_REF: ${{ steps.resolve.outputs.ref }}
        run: |
          set -euo pipefail
          git init tailscale-src
          git -C tailscale-src remote add origin https://github.com/tailscale/tailscale.git
          git -C tailscale-src fetch --depth=1 origin "$TS_REF"
          git -C tailscale-src checkout --detach FETCH_HEAD

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: tailscale-src/go.mod
          cache-dependency-path: tailscale-src/go.sum

      - name: Detect version
        id: version
        run: |
          set -euo pipefail
          vars="$(cd tailscale-src && ./build_dist.sh shellvars)"
          version="$(printf '%s\n' "$vars" | sed -n 's/^VERSION_SHORT="\([^"]*\)"$/\1/p')"
          test -n "$version"
          echo "short=$version" >> "$GITHUB_OUTPUT"
          echo "Tailscale version: $version"

      - name: Build Tailscale linux/amd64
        run: |
          set -euo pipefail
          mkdir -p dist
          (
            cd tailscale-src
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 ./build_dist.sh --strip -o "$GITHUB_WORKSPACE/dist/tailscale" ./cmd/tailscale
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 ./build_dist.sh --strip -o "$GITHUB_WORKSPACE/dist/tailscaled" ./cmd/tailscaled
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 ./build_dist.sh --strip -o "$GITHUB_WORKSPACE/dist/containerboot" ./cmd/containerboot
          )
          file dist/tailscale dist/tailscaled dist/containerboot

      - name: Build offline Docker image
        env:
          VERSION: ${{ steps.version.outputs.short }}
        run: |
          set -euo pipefail
          mkdir -p image
          cp dist/tailscale dist/tailscaled dist/containerboot image/

          cat > image/entrypoint.sh <<'EOS'
          #!/bin/sh
          set -eu
          mkdir -p /dev/net
          if [ ! -c /dev/net/tun ]; then
            mknod /dev/net/tun c 10 200 2>/dev/null || true
          fi
          if [ -c /dev/net/tun ]; then
            echo "[ikuai-tailscale] /dev/net/tun available"
          else
            echo "[ikuai-tailscale] /dev/net/tun unavailable"
          fi
          exec /usr/local/bin/containerboot
          EOS
          chmod 0755 image/entrypoint.sh

          cat > image/Dockerfile <<'EOF'
          FROM alpine:3.22
          RUN apk add --no-cache ca-certificates iproute2 iptables ip6tables \
           && rm -f /usr/sbin/iptables /usr/sbin/ip6tables \
           && ln -s /usr/sbin/iptables-legacy /usr/sbin/iptables \
           && ln -s /usr/sbin/ip6tables-legacy /usr/sbin/ip6tables
          COPY tailscale tailscaled containerboot /usr/local/bin/
          COPY entrypoint.sh /usr/local/bin/ikuai-tailscale-entrypoint
          RUN chmod 0755 /usr/local/bin/tailscale /usr/local/bin/tailscaled /usr/local/bin/containerboot /usr/local/bin/ikuai-tailscale-entrypoint
          ENTRYPOINT ["/usr/local/bin/ikuai-tailscale-entrypoint"]
          EOF

          docker build --platform linux/amd64 -t tailscale-ikuai:ikuai image
          docker image inspect tailscale-ikuai:ikuai --format 'os={{.Os}} arch={{.Architecture}}'

      - name: Package iKuai Docker app
        env:
          VERSION: ${{ steps.version.outputs.short }}
        run: |
          set -euo pipefail
          STAGE="$GITHUB_WORKSPACE/work"
          PKG="$STAGE/tailscale"
          OUT="$GITHUB_WORKSPACE/out"
          rm -rf "$STAGE" "$OUT"
          mkdir -p "$PKG/app/data/tailscale" "$PKG/ui/ico" "$OUT"

          cat > "$PKG/manifest.json" <<EOF
          {
            "name": "tailscale",
            "version": "$VERSION",
            "display_name": "Tailscale",
            "image": "tailscale-ikuai:ikuai",
            "description": "Tailscale mesh VPN for iKuai 4.0 (experimental Docker package)",
            "type": "1",
            "maintainer": "Bigzhangbig",
            "maintainer_url": "https://github.com/Bigzhangbig/Ikuai4test",
            "distributor": "Bigzhangbig",
            "distributor_url": "https://github.com/Bigzhangbig/Ikuai4test",
            "requirements": {
              "memory": "128MB",
              "storage": "160MB",
              "os_min_version": "4.0.0"
            }
          }
          EOF

          cat > "$PKG/app/.env" <<'EOF'
          CPUS_LIMIT=0
          MEMORY_LIMIT=0
          HOST_IP=0.0.0.0
          RESTART=always
          APP_PORT_HEALTH=41641
          TS_HOSTNAME=ikuai
          TS_AUTHKEY=
          TS_ROUTES=
          TS_EXTRA_ARGS=
          EOF

          cat > "$PKG/app/environment" <<'EOF'
          # Reserved for future advanced environment variables.
          EOF

          cat > "$PKG/app/docker-compose.yaml" <<'EOF'
          services:
            tailscale:
              image: tailscale-ikuai:ikuai
              container_name: tailscale-${NAME_NONCE}
              deploy:
                resources:
                  limits:
                    cpus: ${CPUS_LIMIT}
                    memory: ${MEMORY_LIMIT}
              restart: ${RESTART}
              cap_add:
                - NET_ADMIN
                - NET_RAW
              device_cgroup_rules:
                - 'c 10:200 rwm'
              ports:
                - ${HOST_IP}:${APP_PORT_HEALTH}:9002/tcp
              volumes:
                - ./data/tailscale:/var/lib/tailscale
              environment:
                TS_AUTHKEY: ${TS_AUTHKEY}
                TS_HOSTNAME: ${TS_HOSTNAME}
                TS_STATE_DIR: /var/lib/tailscale
                TS_USERSPACE: "false"
                TS_ACCEPT_DNS: "false"
                TS_AUTH_ONCE: "true"
                TS_ROUTES: ${TS_ROUTES}
                TS_EXTRA_ARGS: ${TS_EXTRA_ARGS}
                TS_ENABLE_HEALTH_CHECK: "true"
                TS_LOCAL_ADDR_PORT: "0.0.0.0:9002"
              env_file:
                - ./environment
              logging:
                driver: "json-file"
                options:
                  max-size: "10m"
                  max-file: "3"
              networks:
                - doc_app_default
              labels:
                createdBy: "Tailscale"
          networks:
            doc_app_default:
              external: true
              name: doc_app_default
          EOF

          cat > "$PKG/app/option.json" <<'EOF'
          [
            {
              "default": 41641,
              "attrname": "APP_PORT_HEALTH",
              "label": {"en": "Health port", "zh": "健康检查端口"},
              "required": true,
              "scope": "config",
              "type": "integer",
              "min": 1,
              "max": 65535,
              "description": {"zh": "连接成功后访问 http://爱快IP:端口/healthz，应返回 HTTP 200。"}
            },
            {
              "default": "ikuai",
              "attrname": "TS_HOSTNAME",
              "label": {"en": "Tailscale hostname", "zh": "Tailscale 设备名"},
              "required": true,
              "scope": "config",
              "type": "text",
              "min": 1,
              "max": 63
            },
            {
              "default": "",
              "attrname": "TS_AUTHKEY",
              "label": {"en": "Tailscale auth key", "zh": "Tailscale Auth Key"},
              "required": false,
              "scope": "config",
              "type": "password",
              "min": 0,
              "max": 256,
              "description": {"zh": "测试阶段建议使用一次性或可撤销 Auth Key。"}
            },
            {
              "default": "",
              "attrname": "TS_ROUTES",
              "label": {"en": "Advertise routes", "zh": "发布子网路由"},
              "required": false,
              "scope": "config",
              "type": "text",
              "min": 0,
              "max": 512,
              "description": {"zh": "第一轮建议留空；后续可填写 192.168.1.0/24 等。"}
            },
            {
              "default": "",
              "attrname": "TS_EXTRA_ARGS",
              "label": {"en": "Extra up args", "zh": "额外 tailscale up 参数"},
              "required": false,
              "scope": "config",
              "type": "text",
              "min": 0,
              "max": 1024
            }
          ]
          EOF

          cat > "$PKG/readme" <<'EOF'
          【实验性 Docker 应用】

          iKuai 4.0 当前“本地安装”入口只接受 Docker 类型应用，因此本包使用 type=1。
          Docker 镜像不是直接引用公共镜像，而是在 GitHub Actions 中从 Tailscale 官方源码编译后打入 ipkg。

          第一轮建议只填写一次性/可撤销 TS_AUTHKEY，TS_ROUTES 与 TS_EXTRA_ARGS 留空。

          本包申请 NET_ADMIN、NET_RAW，并通过 device_cgroup_rules 开放 TUN 字符设备。
          容器启动时会尝试创建 /dev/net/tun，然后以 TS_USERSPACE=false 运行官方 containerboot。

          登录 Tailnet 成功后：
          http://<爱快 LAN IP>:41641/healthz
          应返回 HTTP 200。

          当前使用 iKuai 的 doc_app_default 网络，不使用 host 网络。
          Subnet Router、Exit Node、访问 iKuai 宿主本身等能力需要后续分别验证。
          EOF

          cat > "$PKG/changelog" <<EOF
          $VERSION
          - Switch local install to Docker application type=1.
          - Build tailscale, tailscaled and containerboot from upstream source.
          - Embed offline linux/amd64 Docker image.
          - Request NET_ADMIN/NET_RAW and TUN character-device access.
          - Persistent state and health endpoint.
          EOF

          docker save tailscale-ikuai:ikuai | gzip -9 > "$PKG/docker_image.tar.gz"

          python3 - "$PKG/ui/ico/app.png" <<'PY'
          import binascii, struct, sys, zlib
          w=h=256
          def chunk(k,d):
              return struct.pack(">I",len(d))+k+d+struct.pack(">I",binascii.crc32(k+d)&0xffffffff)
          rows=[]
          for y in range(h):
              row=bytearray([0])
              for x in range(w):
                  rgb=[34,40,49,255]
                  for cx in (72,128,184):
                      for cy in (72,128,184):
                          if (x-cx)**2+(y-cy)**2 <= 12**2:
                              rgb[:3]=[242,244,247]
                  row.extend(rgb)
              rows.append(bytes(row))
          png=b"\x89PNG\r\n\x1a\n"
          png+=chunk(b"IHDR",struct.pack(">IIBBBBB",w,h,8,6,0,0,0))
          png+=chunk(b"IDAT",zlib.compress(b"".join(rows),9))
          png+=chunk(b"IEND",b"")
          open(sys.argv[1],"wb").write(png)
          PY

          python3 -m json.tool "$PKG/manifest.json" >/dev/null
          python3 -m json.tool "$PKG/app/option.json" >/dev/null

          package="$OUT/tailscale-${VERSION}-ikuai-docker.ipkg"
          (cd "$STAGE" && tar -czf "$package" tailscale/)
          gzip -t "$package"
          tar -tzf "$package" >/dev/null
          (cd "$OUT" && sha256sum "$(basename "$package")" > SHA256SUMS)

          echo "Built $package"
          ls -lh "$package" "$PKG/docker_image.tar.gz"
          cat "$OUT/SHA256SUMS"

      - name: Inspect package
        env:
          VERSION: ${{ steps.version.outputs.short }}
        run: |
          set -euo pipefail
          pkg="out/tailscale-$VERSION-ikuai-docker.ipkg"
          tar -tzf "$pkg"
          tar -xOzf "$pkg" tailscale/manifest.json | python3 -m json.tool
          echo "== docker-compose.yaml =="
          tar -xOzf "$pkg" tailscale/app/docker-compose.yaml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tailscale-${{ steps.version.outputs.short }}-ikuai-docker
          path: |
            out/*.ipkg
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
